spring:
  application:
    name: puzzle-game-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/puzzle_game}
    username: ${DATABASE_USERNAME:puzzle_user}
    password: ${DATABASE_PASSWORD:puzzle_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt-secret: ${JWT_SECRET:change-this-local-jwt-secret-at-least-32-characters}
    hmac-secret: ${HMAC_SECRET:change-this-local-hmac-secret-at-least-32-characters}
    player-jwt-minutes: 15
    device-token-days: 90
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
