<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindX Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="quiz-card" id="quiz-card">
        <h1>MindX Quiz</h1>

        <section id="quiz-content">
            <div class="quiz-information">
                <p id="question-number">Câu hỏi 1/10</p>
                <p id="score">Điểm: 0</p>
            </div>

            <h2 id="question-text">Nội dung câu hỏi</h2>
            <div class="answer-list" id="answer-list"></div>

            <button id="next-button" type="button" disabled>Câu tiếp theo (Test change)</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
